[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtpro-molecular"
version = "0.1.0.dev0"
description = "Reproduction-oriented implementation of GTpro graph-text molecular representation learning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9,<3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "descriptastorus>=2.6,<3",
  "einops>=0.6,<1",
  "numpy>=1.23,<3",
  "rdkit>=2022.9",
  "scikit-learn>=1.2,<2",
  "scipy>=1.9,<2",
  "torch>=1.13",
  "tqdm>=4.64,<5",
  "PyYAML>=6,<7",
  "requests>=2.28,<3",
]

[project.optional-dependencies]
train = [
  "CoCa-pytorch>=0.1,<0.2",
  "pandas>=1.5,<3",
]
legacy-pyg = [
  "torch-geometric>=2.3,<3",
]
test = [
  "pytest>=7,<9",
  "pytest-cov>=4,<7",
]
dev = [
  "build>=1,<2",
  "pytest>=7,<9",
  "pytest-cov>=4,<7",
  "ruff>=0.5,<1",
]

[project.urls]
"Paper" = "https://doi.org/10.1016/j.jmgm.2024.108843"
"Original GTpro repository" = "https://github.com/zzr624663649/mutimadel_molecular_property"
"GROVER upstream" = "https://github.com/tencent-ailab/grover"

[tool.setuptools.packages.find]
include = ["gtpro*", "pretrain*", "scripts*"]

[tool.setuptools.package-data]
"gtpro.graph_trans" = ["NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
