seeds: [10]
device: auto

data:
  dataset: bace
  root: data/downstream
  split: random
  fractions: [0.8, 0.1, 0.1]
  max_samples: null
  invalid_smiles: drop

model:
  # The full-pipeline runner replaces this with the checkpoint it just trained.
  pretrained_checkpoint: null
  strict_checkpoint: true
  max_checkpoint_mismatch_fraction: 0.0
  encoder_mode: full
  representation: joint
  partial_text_layers: 1
  head_hidden_dim: 256
  head_dropout: 0.1
  text:
    d_model: 768
    n_layers: 6
    vocab_size: 47
    max_length: 201
    d_k: 64
    d_v: 64
    n_heads: 12
    d_ff: 3072
    global_label_dim: 154
    atom_label_dim: 15
  grover:
    hidden_size: 1200
    backbone: dualtrans
    embedding_output_type: both
    dropout: 0.0
    activation: PReLU
    num_mt_block: 1
    num_attn_head: 4
    bias: false
    depth: 6
    dense: false
    undirected: false
    bond_drop_rate: 0.0
    features_only: false
    no_cache: true

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  class_imbalance: auto
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0

output:
  root: runs/paper_finetune
  run_id: "{seed}"
  formal_layout: true
