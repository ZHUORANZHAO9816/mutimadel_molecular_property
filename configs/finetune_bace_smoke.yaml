seeds: [10]
device: cpu

data:
  dataset: bace
  root: data/downstream
  split: random
  fractions: [0.7, 0.15, 0.15]
  max_samples: 64
  invalid_smiles: drop

model:
  pretrained_checkpoint: null
  strict_checkpoint: true
  max_checkpoint_mismatch_fraction: 0.05
  encoder_mode: frozen
  representation: joint
  partial_text_layers: 1
  head_hidden_dim: 32
  head_dropout: 0.1
  text:
    d_model: 32
    n_layers: 1
    vocab_size: 47
    max_length: 201
    d_k: 8
    d_v: 8
    n_heads: 4
    d_ff: 128
    global_label_dim: 154
    atom_label_dim: 15
  grover:
    hidden_size: 32
    backbone: dualtrans
    embedding_output_type: both
    dropout: 0.0
    activation: PReLU
    num_mt_block: 1
    num_attn_head: 4
    bias: false
    depth: 3
    dense: false
    undirected: false
    bond_drop_rate: 0.0
    features_only: false
    no_cache: true

training:
  batch_size: 16
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  class_imbalance: auto
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0

output:
  root: runs/finetune_bace_smoke
