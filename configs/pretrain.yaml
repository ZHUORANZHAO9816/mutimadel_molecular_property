seed: 10
device: auto

data:
  # Generated by the standardized stage-C pretraining data pipeline.
  path: artifacts/pretrain/CHEMBL_smiles
  validation_fraction: 0.1
  max_samples: null

model:
  text:
    d_model: 768
    n_layers: 6
    vocab_size: 47
    max_length: 201
    d_k: 64
    d_v: 64
    n_heads: 12
    d_ff: 3072
    global_label_dim: 154
    atom_label_dim: 15
  grover:
    checkpoint: null
    hidden_size: 1200
    backbone: dualtrans
    embedding_output_type: both
    dropout: 0.0
    activation: PReLU
    num_mt_block: 1
    num_attn_head: 4
    bias: false
    depth: 6
    dense: false
    undirected: false
    bond_drop_rate: 0.0
    features_only: false
    no_cache: true
    freeze: true
  alignment:
    unimodal_depth: 6
    multimodal_depth: 6
    dim_head: 64
    heads: 8
    functional_group_dim: 85
    caption_loss_weight: 1.0
    contrastive_loss_weight: 1.0
    functional_group_loss_weight: 1.0
    use_cross_attention: true

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.00001
  gradient_clip_norm: 1.0
  mixed_precision: auto
  molecule_loss_weight: 1.0
  resume_from: null

output:
  root: runs/pretrain
