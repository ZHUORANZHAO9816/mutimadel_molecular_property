name: CPU CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[train,test]"
      - name: Static import check
        run: python -c "import gtpro; from gtpro import __version__; print(__version__)"
      - name: Unit and fixture integration tests
        run: pytest -q
      - name: CPU model smoke
        run: python examples/ci_smoke_test.py
