name: Bug report
description: Report a reproducible implementation or documentation defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command and input scope
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, RDKit, device, OS, config and seed
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
